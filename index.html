<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Mythbound: Tales of Aetheria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <canvas id="worldCanvas" aria-label="World map"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-loc panel-slim">
        <div class="hud-biome" id="hudBiome">Greenwood Forest</div>
        <div class="hud-clock" id="hudClock">Day 1 · 08:00</div>
      </div>
      <div class="hud-actions">
        <div class="hud-money panel-slim" id="hudMoney">₵ 1,200</div>
        <button class="icon-btn" data-act="openStatus" title="Trainer card">TRAINER</button>
        <button class="icon-btn" data-act="openMenu" title="Menu (Esc)">MENU</button>
      </div>
    </div>

    <div id="hudQuest" class="hud-quest panel-slim"></div>
    <div id="hudParty" class="hud-party"></div>
    <div id="interactHint" class="interact-hint hidden"></div>
    <div id="toasts" class="toasts"></div>

    <div id="touchControls" class="touch-controls hidden">
      <div id="joystick" class="joystick"><div class="joystick-knob"></div></div>
      <div class="touch-buttons">
        <button class="touch-btn touch-menu" data-act="openMenu">☰</button>
        <button class="touch-btn touch-a" data-act="interact">A</button>
      </div>
    </div>
  </div>

  <div id="screenRoot" class="screen-root"></div>
  <div id="battleRoot" class="battle-root"></div>
  <div id="dialogRoot" class="dialog-root"></div>
  <div id="titleScreen" class="title-screen hidden"></div>
  <div id="fadeOverlay" class="fade-overlay"></div>
  <div id="floatLayer" class="float-layer"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
